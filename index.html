<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Webflora Management</title>
  <meta name="description" content="Efficiently manage operations, projects, clients, and communications with Webflora Management." />
  <meta name="author" content="Shashank Manohar" />

  <!-- Self-healing: if an asset fails to load after a deployment, clear stale Service Worker & reload fresh -->
  <script>
    window.addEventListener('error', function (e) {
      var target = e.target;
      if (target && (target.tagName === 'LINK' || target.tagName === 'SCRIPT')) {
        var url = target.src || target.href;
        if (url && (url.indexOf('.css') !== -1 || url.indexOf('.js') !== -1)) {
          if (!sessionStorage.getItem('sw_asset_recovery_done')) {
            sessionStorage.setItem('sw_asset_recovery_done', '1');
            console.warn('Asset failed to load. Clearing Service Worker and reloading:', url);
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (registrations) {
                return Promise.all(registrations.map(function (reg) { return reg.unregister(); }));
              }).then(function () {
                if (window.caches) {
                  return caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (key) { return caches.delete(key); }));
                  });
                }
              }).finally(function () {
                window.location.reload(true);
              });
            } else {
              window.location.reload(true);
            }
          }
        }
      }
    }, true);
  </script>

  <!-- PWA & Mobile Icons -->
  <link rel="icon" type="image/png" href="/minilogo.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Theme & PWA Settings -->
  <meta name="theme-color" content="#FF5528" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Webflora" />

  <!-- Open Graph / Facebook -->
  <meta property="og:title" content="Webflora Management" />
  <meta property="og:description" content="Efficiently manage operations, projects, clients, and communications with Webflora Management." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/webfloralogo.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Webflora Management" />
  <meta name="twitter:description" content="Efficiently manage operations with Webflora Management." />
  <meta name="twitter:image" content="/webfloralogo.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Reset recovery flag on successful window load
    window.addEventListener('load', function () {
      sessionStorage.removeItem('sw_asset_recovery_done');
    });

    if ('serviceWorker' in navigator) {
      const isLocalhost = Boolean(
        window.location.hostname === 'localhost' ||
        window.location.hostname === '[::1]' ||
        window.location.hostname.match(/^127(?:\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)){3}$/)
      );

      if (isLocalhost) {
        // In local development, unregister any active service worker
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const reg of registrations) {
            reg.unregister();
          }
        }).catch(() => {});
      } else {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('Service Worker registered successfully:', reg.scope);
              // Check for SW updates
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('New content available, auto-updating...');
                    }
                  };
                }
              };
            })
            .catch((err) => console.error('Service Worker registration failed:', err));
        });
      }
    }
  </script>
</body>

</html>
